<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0">

    <title>Mi Mundo Amarillo 🌻</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        .inicio {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at center,
                    #4d3900 0%,
                    #120e00 45%,
                    #000 100%
                );
        }

        .contenido {
            max-width: 600px;
        }

        h1 {
            color: #ffd21c;
            font-size: 38px;

            text-shadow:
                0 0 10px #ffd21c,
                0 0 25px #ffae00;

            margin-bottom: 25px;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
            color: #fff8d6;
        }

        button {
            margin-top: 25px;

            padding: 15px 25px;

            border: none;
            border-radius: 30px;

            background: #ffd21c;

            color: #241900;

            font-size: 17px;
            font-weight: bold;

            box-shadow:
                0 0 15px #ffd21c,
                0 0 35px rgba(255, 210, 28, 0.5);
        }
    </style>
</head>

<body>

    <main class="inicio">

        <section class="contenido">

            <h1>
                Mi niña hermosa 💛
            </h1>

            <p>
                Sé que no llevamos tanto tiempo,
                pero estos 5 meses que estamos juntos
                he sentido que te amo más y más,
                y siempre serás una persona muy
                especial en mi vida.
            </p>

            <button>
                Entrar a nuestro mundo 🌻
            </button>

        </section>

    </main>

</body>
</html>
